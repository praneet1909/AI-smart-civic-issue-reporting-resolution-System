spring:
  application:
    name: ai-smart-civic
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_smart_civic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:pallavi2015}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

ai:
  enabled: ${AI_ENABLED:false}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gemini-1.5-flash}
  base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:5}

file:
  storage-path: ${FILE_STORAGE_PATH:./uploads}

logging:
  level:
    root: INFO
    com.aismartcivic: INFO
