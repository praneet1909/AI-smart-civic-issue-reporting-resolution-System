# Local development profile. Production should use Flyway/Liquibase, not ddl-auto=update.
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: ${JWT_SECRET:dev-only-not-for-production-use-override-via-env}

app:
  seed:
    admin-password: ${DEMO_ADMIN_PASSWORD:Admin@12345}
    officer-password: ${DEMO_OFFICER_PASSWORD:Officer@12345}

logging:
  level:
    org.hibernate.SQL: DEBUG
